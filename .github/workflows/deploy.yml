name: Build & Deploy Alakbar API

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alakbar-production
  cancel-in-progress: false

jobs:
  build:
    name: Build Laravel REST API
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, xml, curl, zip, bcmath, intl, gd, pdo_mysql
          tools: composer:v2
          coverage: none

      - name: Validate Composer
        run: composer validate --no-check-publish

      - name: Install production dependencies
        run: |
          composer install \
            --no-dev \
            --prefer-dist \
            --optimize-autoloader \
            --no-interaction \
            --no-progress \
            --no-scripts

      - name: Verify Laravel files
        run: |
          test -f artisan
          test -f vendor/autoload.php
          test -f public/index.php

      - name: Package Laravel API
        run: |
          tar -czf "$RUNNER_TEMP/alakbar.tar.gz" \
            --exclude='./.git' \
            --exclude='./.github' \
            --exclude='./.env' \
            --exclude='./.env.*' \
            --exclude='./node_modules' \
            --exclude='./tests' \
            --exclude='./resources/js' \
            --exclude='./resources/css' \
            --exclude='./public/build' \
            --exclude='./storage/app' \
            --exclude='./storage/logs' \
            --exclude='./storage/framework' \
            --exclude='./bootstrap/cache' \
            --exclude='./.user.ini' \
            .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: alakbar-api
          path: ${{ runner.temp }}/alakbar.tar.gz
          retention-days: 1
          if-no-files-found: error

  deploy:
    name: Deploy API to sysbill
    needs: build

    runs-on:
      - self-hosted
      - linux
      - x64
      - alakbar
      - production

    timeout-minutes: 15

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: alakbar-api
          path: ${{ runner.temp }}/alakbar-download

      - name: Deploy Laravel REST API
        shell: bash
        run: |
          set -Eeuo pipefail

          TARGET="/www/wwwroot/api.alakbar.or.id"
          ARCHIVE="$RUNNER_TEMP/alakbar-download/alakbar.tar.gz"
          STAGING="$(mktemp -d "$RUNNER_TEMP/alakbar.XXXXXXXX")"

          cleanup() {
            rm -rf -- "$STAGING"
            rm -rf -- "$RUNNER_TEMP/alakbar-download"
          }
          trap cleanup EXIT

          echo "=== VALIDATE ARTIFACT ==="
          test -f "$ARCHIVE"
          test -d "$TARGET"
          test -w "$TARGET"

          echo "=== EXTRACT ARTIFACT ==="
          tar -xzf "$ARCHIVE" -C "$STAGING"

          test -f "$STAGING/artisan"
          test -f "$STAGING/vendor/autoload.php"
          test -f "$STAGING/public/index.php"

          echo "=== PREPARE RUNTIME DIRECTORIES ==="
          mkdir -p \
            "$TARGET/storage/app" \
            "$TARGET/storage/framework/cache/data" \
            "$TARGET/storage/framework/sessions" \
            "$TARGET/storage/framework/views" \
            "$TARGET/storage/logs" \
            "$TARGET/bootstrap/cache"

          echo "=== SYNC DEPLOYMENT ==="
          rsync -rlt --delete \
            --no-perms \
            --no-owner \
            --no-group \
            --exclude='/.env' \
            --exclude='/.env.*' \
            --exclude='/.user.ini' \
            --exclude='/.well-known/' \
            --exclude='/404.html' \
            --exclude='/502.html' \
            --exclude='/index.html' \
            --exclude='/.htaccess' \
            --exclude='/storage/' \
            --exclude='/bootstrap/cache/' \
            --exclude='/public/storage/' \
            --exclude='/public/.user.ini' \
            --exclude='/public/.well-known/' \
            --exclude='/.git/' \
            --exclude='/.github/' \
            "$STAGING/" "$TARGET/"

          echo "=== VERIFY DEPLOYMENT ==="
          test -f "$TARGET/artisan"
          test -f "$TARGET/vendor/autoload.php"
          test -f "$TARGET/public/index.php"

          echo "Deployment files completed successfully."
          echo "Host: $(hostname)"
          echo "Target: $TARGET"

      - name: Deployment summary
        shell: bash
        run: |
          echo "### Alakbar REST API Deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "- Server: sysbill" >> "$GITHUB_STEP_SUMMARY"
          echo "- Target: /www/wwwroot/api.alakbar.or.id" >> "$GITHUB_STEP_SUMMARY"
          echo "- Build: GitHub-hosted runner" >> "$GITHUB_STEP_SUMMARY"
          echo "- Composer on VPS: No" >> "$GITHUB_STEP_SUMMARY"
          echo "- Frontend build: No" >> "$GITHUB_STEP_SUMMARY"
          echo "- Database migration: No" >> "$GITHUB_STEP_SUMMARY"
